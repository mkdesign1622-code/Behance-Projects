<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tier-List Projects | maxk.design</title>
    <style>
        :root {
            --behance-blue: #0057ff;
            --behance-blue-hover: #0045cc;
            --bg-color: #f9f9f9;
            --card-bg: #ffffff;
            --text-main: #191919;
            --text-secondary: #696969;
            --border-color: #e8e8e8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .navbar {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 0 24px;
            height: 64px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .nav-brand {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-logo {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            object-fit: cover;
        }

        .nav-profile {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-profile-img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--border-color);
        }

        .made-by {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .main-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .randomizer-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 48px 40px;
            width: 100%;
            max-width: 540px;
            text-align: center;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
        }

        .card-header {
            margin-bottom: 32px;
        }

        .card-header h2 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .result-box {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 32px 24px;
            margin-bottom: 32px;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .project-category {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .project-name {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.3;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            border: none;
            padding: 0 24px;
            height: 48px;
            border-radius: 24px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            text-decoration: none;
        }

        .btn-primary {
            background-color: var(--behance-blue);
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: var(--behance-blue-hover);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            border-color: var(--text-secondary);
        }
        
        .btn-primary.hidden {
            display: none;
        }

        @media (max-width: 480px) {
            .randomizer-card {
                padding: 32px 20px;
            }
            .nav-brand {
                font-size: 18px;
            }
            .made-by {
                display: none;
            }
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="nav-brand">
            <img src="Behance logo.jpg" alt="Behance" class="nav-logo">
            Tier-List Projects
        </div>
        <div class="nav-profile">
            <span class="made-by">made by maxk.design</span>
            <img src="photo_2026-09-12_19-14-46.jpg" alt="MK" class="nav-profile-img">
        </div>
    </header>

    <main class="main-container">
        <div class="randomizer-card">
            <div class="card-header">
                <h2>Оценка проектов по тирлисту</h2>
            </div>

            <div class="result-box">
                <div class="project-category" id="project-category">Категория</div>
                <div class="project-name" id="project-name">Нажми кнопку ниже, чтобы найти проект</div>
            </div>

            <div class="action-buttons">
                <a href="#" target="_blank" class="btn btn-primary hidden" id="open-btn">Оценить проект</a>
                <button class="btn btn-secondary" id="generate-btn" onclick="generateProject()">Найти случайный проект</button>
            </div>
        </div>
    </main>

    <script>
        const behanceProjects = [
            { name: "GEOBO Branding", category: "Branding", url: "https://www.behance.net/gallery/191577699/GEOBO-Branding" },
            { name: "Valence - App Branding UX/UI", category: "UI/UX & Branding", url: "https://www.behance.net/gallery/254923849/Valence-App-Branding-UXUI" },
            { name: "VISCERA Fermented Beauty Elixirs", category: "Brand Identity", url: "https://www.behance.net/gallery/255617091/VISCERA-Fermented-Beauty-Elixirs" },
            { name: "VERE Store Design E-com", category: "Web Design", url: "https://www.behance.net/gallery/255647553/VERE-Store-Design-E-com" },
            { name: "KARU Luxury Vintage Menswear Brand Identity", category: "Branding", url: "https://www.behance.net/gallery/255671505/KARU-Luxury-Vintage-Menswear-Brand-Identity" },
            { name: "SPECIMEN Botanical Archive", category: "Web & Identity", url: "https://www.behance.net/gallery/255573503/SPECIMEN-Botanical-Archive" },
            { name: "Казино для роботов | Многостраничный веб-сайт", category: "Web Design", url: "https://www.behance.net/gallery/255671845/kazino-dlja-robotov-mnogostranichnyj-vebsajt" },
            { name: "Brand Identity & Website Design for Brickwork", category: "Web & Branding", url: "https://www.behance.net/gallery/255267043/Brand-Identity-Website-Design-for-Brickwork" },
            { name: "FIKR Independent Research Project (RCA)", category: "Identity", url: "https://www.behance.net/gallery/255343243/FIKR-Independent-Research-Project-(RCA)" },
            { name: "TakesTwoToTango Website", category: "Web Design", url: "https://www.behance.net/gallery/254981339/TakesTwoToTango-Website" }
        ];

        let isGenerating = false;

        function generateProject() {
            if (isGenerating) return;
            isGenerating = true;

            const categoryEl = document.getElementById('project-category');
            const nameEl = document.getElementById('project-name');
            const openBtn = document.getElementById('open-btn');
            const generateBtn = document.getElementById('generate-btn');

            openBtn.classList.add('hidden');
            generateBtn.innerText = "Поиск проекта...";
            generateBtn.style.opacity = "0.5";

            let spinCount = 0;
            const maxSpins = 12;

            const interval = setInterval(() => {
                const randomProj = behanceProjects[Math.floor(Math.random() * behanceProjects.length)];
                categoryEl.innerText = randomProj.category;
                nameEl.innerText = randomProj.name;
                
                spinCount++;

                if (spinCount >= maxSpins) {
                    clearInterval(interval);
                    
                    const finalProj = behanceProjects[Math.floor(Math.random() * behanceProjects.length)];
                    categoryEl.innerText = finalProj.category;
                    nameEl.innerText = finalProj.name;
                    openBtn.href = finalProj.url;

                    openBtn.classList.remove('hidden');
                    generateBtn.innerText = "Найти другой проект";
                    generateBtn.style.opacity = "1";
                    
                    isGenerating = false;
                }
            }, 70); 
        }
    </script>
</body>
</html>
